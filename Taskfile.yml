version: "3"

vars:
  COMPOSE: docker compose -f backend/docker-compose.yaml
  EXEC: docker exec yaoyao-api
  REDIS_EXEC: docker exec yaoyao-redis redis-cli -a pass

tasks:
  setup:
    desc: Install dependencies for both frontend and backend
    cmds:
      - "cd frontend && bun install"
      - "cd backend && bun install"
      - "cp backend/.env.example backend/.env"
      - "cp frontend/.env.example frontend/.env"
      - "cd infra && terraform init"

  frontend:
    aliases:
      - f
    desc: Start the frontend development server
    cmd: "cd frontend && bun run dev"
  # ── Docker ───────────────────────────────────────────────────────────────────

  generate:
    desc: Generate orval code from OpenAPI spec
    cmd: "cd frontend && bun run api:generate"

  backend:
    aliases:
      - b
    desc: Start all containers
    cmd: "{{.COMPOSE}} up -d"

  backend:stop:
    aliases:
      - bs
    desc: Stop all containers
    cmd: "{{.COMPOSE}} down"

  build:
    aliases:
      - build
    desc: Rebuild the api image and restart
    cmds:
      - "{{.COMPOSE}} build api"
      - "{{.COMPOSE}} up -d api"

  # ── Database ─────────────────────────────────────────────────────────────────

  db:apply:
    desc: Apply pending migrations
    cmds:
      - "{{.EXEC}} bunx prisma migrate deploy"
      - "cd backend && bunx prisma generate"

  db:reset:
    desc: Reset DB and re-apply all migrations (destroys data)
    cmd: "{{.EXEC}} bunx prisma migrate reset --force"

  db:seed:
    desc: Seed the database with initial data
    cmd: "{{.EXEC}} bun run prisma/seed.ts"

  db:fresh:
    desc: Reset DB, apply migrations, and seed
    cmds:
      - task: db:reset
      - task: db:seed

  db:migrate:
    desc: Create a new migration
    cmd: "{{.EXEC}} bunx prisma migrate dev --name {{.NAME}}"

  # ── Redis ────────────────────────────────────────────────────────────────────

  redis:flush:
    desc: Flush all Redis cache
    cmd: "{{.REDIS_EXEC}} FLUSHALL"

  redis:keys:
    desc: List all Redis keys
    cmd: "{{.REDIS_EXEC}} KEYS '*'"

  infra:apply:
    desc: Apply Terraform configuration
    cmd: "cd infra && doppler run terraform apply"
